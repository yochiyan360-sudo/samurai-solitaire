  #bgLayer::after{
    content:'';
    position:fixed;
    inset:0;
    background:linear-gradient(180deg, rgba(4,10,4,.55) 0%, rgba(4,10,4,.35) 35%, rgba(4,10,4,.6) 100%);
    z-index:0;
  }
  #wrap{
    width:820px;
    position:absolute;
    top:0;
    left:0;
    padding:0 10px 40px;
    z-index:1;
    transform-origin:top left;
  }
  #header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding:8px 4px 0;
  }
  #header h1{
    font-size:15px;
    margin:0;
    letter-spacing:1px;
    color:#fff;
    text-shadow:1px 1px 0 #000;
    font-weight:normal;
  }
  #statusbar{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#fff;
    text-shadow:1px 1px 0 #000;
    padding:2px 6px 8px;
  }
  #newGameBtn{
    background:linear-gradient(180deg,#e8e4da,#b8b4aa);
    color:#000;
    border:2px outset #d4d0c8;
    padding:4px 12px;
    font-size:12px;
    cursor:pointer;
  }
  #newGameBtn:active{border-style:inset;}

  #topRow{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .pile{
    width:var(--card-w);
    height:var(--card-h);
    border-radius:2px;
    border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.08);
    position:relative;
    flex-shrink:0;
  }
  .foundation-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    color:rgba(255,255,255,.25);
    pointer-events:none;
  }
  .tableau-empty{
    position:absolute;
    top:0;
    left:0;
    width:var(--card-w);
    height:var(--card-h);
    border:2px dashed rgba(255,255,255,.35);
    border-radius:4px;
    background:rgba(255,255,255,.05);
    pointer-events:none;
  }
  #spacer{flex:1;}
  #foundations{display:flex;gap:8px;}

  #tableau{
    display:flex;
    gap:8px;
  }
  .column{
    width:var(--card-w);
    position:relative;
    min-height:var(--card-h);
    flex-shrink:0;
  }

  .card{
    position:absolute;
    left:0;
    width:var(--card-w);
    height:var(--card-h);
    border-radius:2px;
    background:#fff;
    box-shadow:1px 1px 3px rgba(0,0,0,.5);
    border:1px solid #000;
    cursor:pointer;
    transition:top .1s ease;
    font-size:13px;
    font-weight:bold;
    font-family:"Times New Roman",serif;
  }
  .card.back{
    background:
      repeating-linear-gradient(45deg, #0f3fa0 0 4px, #1a56c8 4px 8px),
      repeating-linear-gradient(-45deg, #0f3fa0 0 4px, #1a56c8 4px 8px);
    background-blend-mode:multiply;
    border:2px solid #fff;
  }
  .card .corner{
    position:absolute;
    left:5px;top:2px;
    line-height:1.05;
    text-align:center;
    font-size:19px;
  }
  .card .corner.br{
    left:auto;right:5px;top:auto;bottom:2px;
    transform:rotate(180deg);
  }
  .card .pip{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
  }
  .card.red{color:#c00;}
  .card.black{color:#000;}
  .card.selected{
    box-shadow:0 0 0 3px #ffe066, 2px 2px 4px rgba(0,0,0,.6);
    top:-4px !important;
  }
  .card.ghosted{
    opacity:.22;
    transition:opacity .15s ease;

<body>
<div id="bgLayer"></div>
<div id="stage16x9">
<div id="wrap">
  <div id="header">
    <h1>ソリティア - クロンダイク</h1>
    <button id="newGameBtn">ゲーム(N)</button>
  </div>
  <div id="statusbar">
    <span id="scoreDisp">得点: 0</span>
    <span id="timeDisp">時間: 0:00</span>
  </div>

  <div id="topRow">
    <div class="pile" id="stockPile"></div>
    <div class="pile" id="wastePile"></div>
    <div id="spacer"></div>
    <div id="foundations">
      <div class="pile foundation" id="fnd-0"></div>
      <div class="pile foundation" id="fnd-1"></div>
      <div class="pile foundation" id="fnd-2"></div>
      <div class="pile foundation" id="fnd-3"></div>
    </div>
  </div>

  <div id="tableau"></div>

  <div id="hint">カードをドラッグして移動できます（クリックして選択 → 移動先クリックも可）／裏向きの一番上のカードはクリックでめくれます</div>
</div>
</div>

<div id="winBanner">
  <h2>CONGRATULATIONS!</h2>
  <div>クリア！ 得点: <span id="winMoves">0</span></div>
  <button id="winNewGame">もう一度あそぶ</button>
</div>

<script>
const SUITS = ['S','H','D','C'];
const SUIT_SYMBOL = {S:'♠',H:'♥',D:'♦',C:'♣'};
const SUIT_COLOR = {S:'black',H:'red',D:'red',C:'black'};
const RANK_LABEL = {1:'A',11:'J',12:'Q',13:'K'};
// 1列に積み上がりうる最大枚数を想定した固定の高さ（プレイ中に全体サイズが変わらないように）
const MAX_STACK_CARDS = 13;
const MAX_COLUMN_HEIGHT = (MAX_STACK_CARDS-1)*30 + 130;

function rankLabel(r){ return RANK_LABEL[r] || String(r); }

let stock=[], waste=[], foundations=[[],[],[],[]], tableau=[[],[],[],[],[],[],[]];
let selection=null; // {type:'tableau', col, idx} or {type:'waste'}
let moves=0, score=0, seconds=0, timerId=null, autoRunning=false;

function freshDeck(){
  const d=[];
  for(const s of SUITS){
    for(let r=1;r<=13;r++){
      d.push({suit:s, rank:r, faceUp:false, id:s+r});
    }
  }
  for(let i=d.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [d[i],d[j]]=[d[j],d[i]];
  }
  return d;
}

function newGame(){
  const deck = freshDeck();
  stock=[]; waste=[]; foundations=[[],[],[],[]];
  tableau=[[],[],[],[],[],[],[]];
  selection=null; moves=0; score=0; seconds=0; autoRunning=false;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{ seconds++; updateStatus(); }, 1000);
  updateStatus();
  document.getElementById('winBanner').classList.remove('show');

  for(let c=0;c<7;c++){
    for(let k=0;k<=c;k++){
      const card = deck.pop();
      card.faceUp = (k===c);
      tableau[c].push(card);
    }
  }
  stock = deck;
  stock.forEach(c=>c.faceUp=false);
  render();
}

function updateStatus(){
  document.getElementById('scoreDisp').textContent = '得点: '+Math.max(0,score);
  const m = Math.floor(seconds/60), s = seconds%60;
  document.getElementById('timeDisp').textContent = '時間: '+m+':'+String(s).padStart(2,'0');
}
function addScore(n){ score += n; updateStatus(); }

function cardHTML(card, extraClass){
  const cls = ['card', SUIT_COLOR[card.suit], extraClass||''].join(' ').trim();

  if(card.rank>=11 && card.rank<=13){
    // J/Q/Kは専用イラストを背景に使う。今回の絵にはランク/スートの表記が
    // 描き込まれていないので、常に隅に正しいランク・スートのラベルを貼る
    const artCls = 'art-'+card.rank;
    const patches = `
      <div class="facepatch tl">${rankLabel(card.rank)}<br>${SUIT_SYMBOL[card.suit]}</div>
      <div class="facepatch br">${rankLabel(card.rank)}<br>${SUIT_SYMBOL[card.suit]}</div>`;
    return `<div class="${cls} ${artCls}" data-id="${card.id}">${patches}</div>`;
  }

  return `<div class="${cls}" data-id="${card.id}">
      <div class="corner">${rankLabel(card.rank)}<br>${SUIT_SYMBOL[card.suit]}</div>
      <div class="pip">${SUIT_SYMBOL[card.suit]}</div>
      <div class="corner br">${rankLabel(card.rank)}<br>${SUIT_SYMBOL[card.suit]}</div>
    </div>`;
}

function backHTML(){
  return `<div class="card back"></div>`;
}

function renderDOM(){
  // stock
  const stockEl = document.getElementById('stockPile');
  stockEl.innerHTML = stock.length ? backHTML() : '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.4);">↺</div>';
  stockEl.onclick = onStockClick;

  // waste
  const wasteEl = document.getElementById('wastePile');
  wasteEl.innerHTML = '';
  if(waste.length){
    const top = waste[waste.length-1];
    const isSel = selection && selection.type==='waste';
    wasteEl.innerHTML = cardHTML(top, isSel?'selected':'');
    const cardEl = wasteEl.querySelector('.card');
    cardEl.onclick = (e)=>{ e.stopPropagation(); onWasteCardClick(); };
    makeDraggable(cardEl, {type:'waste'});
  }
  wasteEl.onclick = (e)=>{ if(e.target===wasteEl) onWasteAreaClick(); };

  // foundations（4つとも最初はどのスートでも受け付ける汎用スロット。
  // 最初にAが置かれた時点でそのスートに確定する）
  for(let i=0;i<4;i++){
    const el = document.getElementById('fnd-'+i);
    const pile = foundations[i];
    const isSelF = selection && selection.type==='foundation' && selection.index===i;
    if(pile.length){
      el.innerHTML = cardHTML(pile[pile.length-1], isSelF?'selected':'');
      const cardEl = el.querySelector('.card');
      cardEl.onclick = (e)=>{ e.stopPropagation(); onFoundationClick(i); };
      makeDraggable(cardEl, {type:'foundation', index:i});
    }else{
      el.innerHTML = '<div class="foundation-empty">A</div>';
    }
    el.onclick = (e)=>{ if(e.target===el) onFoundationClick(i); };
  }

  // tableau
  const tEl = document.getElementById('tableau');
  tEl.innerHTML = '';
  tableau.forEach((col,ci)=>{
    const colDiv = document.createElement('div');
    colDiv.className='column';
    let y=0;
    if(col.length===0){
      const ph = document.createElement('div');
      ph.className = 'tableau-empty';
      colDiv.appendChild(ph);
    }
    col.forEach((card,ki)=>{
      const div = document.createElement('div');
      div.style.position='absolute';
      div.style.top = y+'px';
      div.style.zIndex = ki;
      const isSel = selection && selection.type==='tableau' && selection.col===ci && ki>=selection.idx;
      const isCovering = selection && selection.type==='tableau' && selection.col===ci && ki>selection.idx;
      const extra = [isSel?'selected':'', isCovering?'ghosted':''].join(' ').trim();
      div.innerHTML = card.faceUp ? cardHTML(card, extra) : backHTML();
      const cardEl = div.querySelector('.card');
      cardEl.onclick = (e)=>{ e.stopPropagation(); onTableauCardClick(ci,ki); };

      if(card.faceUp){
        // Dragging any face-up tableau card carries that card and every face-up
        // card below it as one stack.
        makeDraggable(cardEl, {type:'tableau', col:ci, idx:ki});
      }
      colDiv.appendChild(div);
      y += card.faceUp ? 30 : 9;
    });
    colDiv.style.minHeight = MAX_COLUMN_HEIGHT+'px';
    colDiv.onclick = ()=>onColumnAreaClick(ci);
    tEl.appendChild(colDiv);
  });

  updateStatus();
}

let dragCtx = null;
let currentStageScale = 1;
let suppressNextClick = false;

// クリックとドラッグの競合を防ぐ：ドラッグ直後の click は握りつぶす
document.addEventListener('click', (e)=>{
  if(suppressNextClick){
    suppressNextClick = false;
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

// makeDraggable(cardEl, source) : cardEl を source からドラッグして動かせるようにする
function makeDraggable(cardEl, source){
  cardEl.style.cursor = 'grab';
  cardEl.onmousedown = (e)=>{
    if(e.button!==0) return; // 左クリックのみ
    const cards = getDragCards(source);
    if(!cards.length) return;
    const rect = cardEl.getBoundingClientRect();
    dragCtx = {
      source, cards,
      startX:e.clientX, startY:e.clientY,
      offsetX:e.clientX-rect.left, offsetY:e.clientY-rect.top,
      originLeft:rect.left, originTop:rect.top,
      moved:false, ghostEl:null
    };
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  };
}

function onDragMove(e){
  if(!dragCtx) return;
  const dx=e.clientX-dragCtx.startX, dy=e.clientY-dragCtx.startY;
  if(!dragCtx.moved){
    if(Math.hypot(dx,dy) < 4) return;
    dragCtx.moved = true;
    createGhost();
  }
  dragCtx.ghostEl.style.left = (e.clientX-dragCtx.offsetX)+'px';
  dragCtx.ghostEl.style.top = (e.clientY-dragCtx.offsetY)+'px';
}

function createGhost(){
  const ghost = document.createElement('div');
  ghost.style.position='fixed';
  ghost.style.zIndex='999';
  ghost.style.pointerEvents='none';
  ghost.style.left = dragCtx.originLeft+'px';
  ghost.style.top = dragCtx.originTop+'px';
  ghost.style.opacity='0.95';
  // ステージ全体の縮尺と合わせて、ドラッグ中もカードの見た目サイズが変わらないようにする
  ghost.style.transform = `scale(${currentStageScale})`;
  ghost.style.transformOrigin = 'top left';
  dragCtx.cards.forEach((c,i)=>{
    const d=document.createElement('div');
    d.style.position='absolute';
    d.style.top=(i*30)+'px';
    d.innerHTML = cardHTML(c,'');
    ghost.appendChild(d);
  });
  document.body.appendChild(ghost);
  dragCtx.ghostEl = ghost;
  hideSourceElements();
}

function hideSourceElements(){
  const info = dragCtx.source;
  if(info.type==='waste'){
    const c = document.getElementById('wastePile').querySelector('.card');
    if(c) c.style.opacity='0';
  }else if(info.type==='foundation'){
    const c = document.getElementById('fnd-'+info.index).querySelector('.card');
    if(c) c.style.opacity='0';
  }else if(info.type==='tableau'){
    const colDiv = document.getElementById('tableau').children[info.col];
    if(colDiv){
      Array.from(colDiv.children).slice(info.idx).forEach(ch=>{ ch.style.opacity='0'; });
      // 列の一番下（idx===0）からドラッグしている＝この列が丸ごと空になる場合は、
      // ドラッグ中でも置き場のプレースホルダーを見せておく
      if(info.idx===0){
        const ph = document.createElement('div');
        ph.className = 'tableau-empty';
        colDiv.appendChild(ph);
      }
    }
  }
}

function onDragEnd(e){
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  if(!dragCtx) return;
  const wasDragging = dragCtx.moved;
  if(dragCtx.ghostEl) dragCtx.ghostEl.remove();

  if(wasDragging){
    suppressNextClick = true;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const foundationPile = el ? el.closest('.pile.foundation') : null;
    const columnEl = el ? el.closest('.column') : null;

    selection = dragCtx.source;
    if(foundationPile){
      tryDropOnFoundation(parseInt(foundationPile.id.replace('fnd-',''), 10));
    }else if(columnEl){
      const colIndex = Array.from(document.getElementById('tableau').children).indexOf(columnEl);
      tryDropOnTableau(colIndex);
    }else{
      clearSelection();
      render();
    }
  }
  dragCtx = null;
}

function getDragCards(source){
  if(source.type==='waste'){
    return waste.length ? [waste[waste.length-1]] : [];
  }
  if(source.type==='tableau'){
    return tableau[source.col].slice(source.idx);
  }
  if(source.type==='foundation'){
    const pile = foundations[source.index];
    return pile.length ? [pile[pile.length-1]] : [];
  }
  return [];
}

function tryDropOnFoundation(index){
  if(!selection){ render(); return; }
  const moving = getSelectedCards();
  if(moving.length!==1 || !canPlaceOnFoundation(moving[0], foundations[index])){
    clearSelection(); render(); return;
  }
  removeSelectedFromSource();
  foundations[index].push(moving[0]);
  moves++;
  addScore(10);
  clearSelection();
  render();
}

function tryDropOnTableau(colIndex){
  if(!selection){ render(); return; }
  if(selection.type==='tableau' && selection.col===colIndex){ clearSelection(); render(); return; }
  const moving = getSelectedCards();
  const destCol = tableau[colIndex];
  const destTop = destCol.length ? destCol[destCol.length-1] : null;
  if(canPlaceOnTableau(moving[0], destTop)){
    const fromWaste = (selection.type==='waste');
    const fromFoundation = (selection.type==='foundation');
    removeSelectedFromSource();
    tableau[colIndex].push(...moving);
    moves++;
    if(fromWaste) addScore(5);
    else if(fromFoundation) addScore(-15);
  }
  clearSelection();
  render();
}

function render(){
  renderDOM();
  checkWin();
  maybeAutoComplete();
  if(typeof fitStage==='function') fitStage();
}

function totalFoundationCount(){
  return foundations.reduce((sum,pile)=>sum+pile.length,0);
}

// カードを置ける組札スロットのインデックスを探す。
// 既にそのスートが割り当て済みのパイルを優先し、無ければ未割り当て(空)のパイルを使う（Aのみ）
function findFoundationIndexFor(card){
  for(let i=0;i<4;i++){
    if(foundations[i].length && foundations[i][foundations[i].length-1].suit===card.suit){
      return canPlaceOnFoundation(card, foundations[i]) ? i : -1;
    }
  }
  for(let i=0;i<4;i++){
    if(foundations[i].length===0 && canPlaceOnFoundation(card, foundations[i])) return i;
  }
  return -1;
}

// 場のカードが全部表向き（山札も空）＝勝利確定の局面で、自動的に組札へ集めていく
function isGuaranteedWin(){
  if(totalFoundationCount()===52) return false;
  if(stock.length>0) return false;
  for(const col of tableau){
    for(const c of col){
      if(!c.faceUp) return false;
    }
  }
  return true;
}

function maybeAutoComplete(){
  if(autoRunning) return;
  if(!isGuaranteedWin()) return;
  autoRunning = true;
  clearSelection();
  autoCompleteStep(0);
}

function autoCompleteStep(safety){
  if(safety > 400){ autoRunning=false; render(); return; } // 念のための安全弁

  // 1. ウェイスト／各列の一番上のカードで、組札に置けるものを探す
  let moved = false;
  if(waste.length){
    const c = waste[waste.length-1];
    const idx = findFoundationIndexFor(c);
    if(idx>=0){
      waste.pop();
      foundations[idx].push(c);
      addScore(10);
      moved = true;
    }
  }
  if(!moved){
    for(let i=0;i<tableau.length;i++){
      const col = tableau[i];
      if(col.length===0) continue;
      const c = col[col.length-1];
      const idx = findFoundationIndexFor(c);
      if(idx>=0){
        col.pop();
        foundations[idx].push(c);
        addScore(10);
        moved = true;
        break;
      }
    }
  }

  // 2. 直接組札に送れない場合、列同士でカードを動かして道を開ける
  if(!moved){
    outer:
    for(let i=0;i<tableau.length;i++){
      const srcCol = tableau[i];
      if(srcCol.length===0) continue;
      const c = srcCol[srcCol.length-1];
      for(let j=0;j<tableau.length;j++){
        if(j===i) continue;
        const destCol = tableau[j];
        const destTop = destCol.length ? destCol[destCol.length-1] : null;
        if(canPlaceOnTableau(c, destTop)){
          srcCol.pop();
          destCol.push(c);
          moved = true;
          break outer;
        }
      }
    }
  }

  renderDOM();

  if(moved && totalFoundationCount()<52){
    setTimeout(()=>autoCompleteStep(safety+1), 90);
  }else{
    autoRunning = false;
    updateStatus();
    checkWin();
  }
}

function clearSelection(){ selection=null; }

function onStockClick(){
  clearSelection();
  if(stock.length===0){
    if(waste.length===0){ render(); return; }
    stock = waste.reverse();
    stock.forEach(c=>c.faceUp=false);
    waste=[];
  }else{
    const c = stock.pop();
    c.faceUp=true;
    waste.push(c);
  }
  moves++;
  render();
}

function onWasteAreaClick(){
  if(waste.length===0) clearSelection();
  render();
}

function onWasteCardClick(){
  if(selection && selection.type==='waste'){ clearSelection(); render(); return; }
  selection = {type:'waste'};
  render();
}

function onFoundationClick(index){
  const pile = foundations[index];

  // 選択中のカードが無ければ、この組札の一番上のカードを選択する（場札へ戻すため）
  if(!selection){
    if(pile.length){
      selection = {type:'foundation', index};
      render();
    }
    return;
  }

  // 同じ組札のカードを選択中にもう一度クリック → 選択解除
  if(selection.type==='foundation' && selection.index===index){
    clearSelection();
    render();
    return;
  }

  // 他の選択中カードをこの組札へ置こうとしている場合
  const moving = getSelectedCards();
  if(moving.length!==1){ clearSelection(); render(); return; }
  const card = moving[0];
  if(canPlaceOnFoundation(card, pile)){
    const fromWaste = (selection.type==='waste');
    removeSelectedFromSource();
    foundations[index].push(card);
    moves++;
    addScore(fromWaste ? 10 : 10);
    clearSelection();
    render();
  }else{
    clearSelection();
    render();
  }
}

function onTableauCardClick(colIndex, cardIndex){
  const col = tableau[colIndex];
  const card = col[cardIndex];
  const isTopFaceDown = (cardIndex===col.length-1 && !card.faceUp);

  if(!selection){
    if(isTopFaceDown){
      card.faceUp=true;
      addScore(5);
      render();
      return;
    }
    if(!card.faceUp) return; // 裏向きの途中カードは選べない
    selection = {type:'tableau', col:colIndex, idx:cardIndex};
    render();
    return;
  }

  // 既に選択がある場合
  if(selection.type==='tableau' && selection.col===colIndex && selection.idx===cardIndex){
    clearSelection(); render(); return;
  }

  // 選択中のカード群をこの列（の一番上）へ移動を試みる
  const moving = getSelectedCards();
  const destTop = col[col.length-1];
  if(canPlaceOnTableau(moving[0], destTop)){
    const fromWaste = (selection.type==='waste');
    const fromFoundation = (selection.type==='foundation');
    removeSelectedFromSource();
    tableau[colIndex].push(...moving);
    moves++;
    if(fromWaste) addScore(5);
    else if(fromFoundation) addScore(-15);
    clearSelection();
    render();
    return;
  }

  // 移動できない場合、クリックしたカードが選択可能なら選び直す
  if(isTopFaceDown){
    clearSelection();
    card.faceUp=true;
    addScore(5);
    render();
    return;
  }
  if(card.faceUp){
    clearSelection();
    selection = {type:'tableau', col:colIndex, idx:cardIndex};
    render();
    return;
  }
  clearSelection();
  render();
}

function onColumnAreaClick(colIndex){
  if(!selection) return;
  const col = tableau[colIndex];
  if(col.length!==0) return; // 空でない列はカード側のクリックで処理済み
  const moving = getSelectedCards();
  if(canPlaceOnTableau(moving[0], null)){
    const fromWaste = (selection.type==='waste');
    const fromFoundation = (selection.type==='foundation');
    removeSelectedFromSource();
    tableau[colIndex].push(...moving);
    moves++;
    if(fromWaste) addScore(5);
    else if(fromFoundation) addScore(-15);
    clearSelection();
    render();
  }else{
    clearSelection();
    render();
  }
}

function getSelectedCards(){
  if(!selection) return [];
  if(selection.type==='waste') return [waste[waste.length-1]];
  if(selection.type==='tableau') return tableau[selection.col].slice(selection.idx);
  if(selection.type==='foundation'){
    const pile = foundations[selection.index];
    return pile.length ? [pile[pile.length-1]] : [];
  }
  return [];
}

function removeSelectedFromSource(){
  if(selection.type==='waste'){ waste.pop(); return; }
  if(selection.type==='tableau'){
    tableau[selection.col] = tableau[selection.col].slice(0, selection.idx);
    const col = tableau[selection.col];
    if(col.length && !col[col.length-1].faceUp){
      col[col.length-1].faceUp = true;
      addScore(5);
    }
    return;
  }
  if(selection.type==='foundation'){
    foundations[selection.index].pop();
  }
}

function canPlaceOnFoundation(card, pile){
  if(pile.length===0) return card.rank===1;
  const top = pile[pile.length-1];
  return card.suit===top.suit && card.rank===top.rank+1;
}

function canPlaceOnTableau(card, destTopCardOrNull){
  if(!destTopCardOrNull) return card.rank===13;
  if(!destTopCardOrNull.faceUp) return false;
  const sameColor = SUIT_COLOR[card.suit]===SUIT_COLOR[destTopCardOrNull.suit];
  return !sameColor && card.rank===destTopCardOrNull.rank-1;
}

function checkWin(){
  const total = foundations.reduce((sum,pile)=>sum+pile.length,0);
  if(total===52){
    if(timerId){ clearInterval(timerId); timerId=null; }
    document.getElementById('winMoves').textContent = Math.max(0,score);
    document.getElementById('winBanner').classList.add('show');
  }
}

document.getElementById('newGameBtn').onclick = newGame;
document.getElementById('winNewGame').onclick = newGame;

newGame();

document.addEventListener('keydown', (e)=>{
  if(e.code==='Space' || e.key===' '){
    e.preventDefault();
    onStockClick();
  }
});

// ゲーム全体を16:9のステージ内に収まるよう縮尺調整する
function fitStage(){
  const stage = document.getElementById('stage16x9');
  const wrap = document.getElementById('wrap');
  wrap.style.transform = 'none';
  const naturalW = wrap.offsetWidth;
  const naturalH = wrap.scrollHeight;
  const stageRect = stage.getBoundingClientRect();
  const scale = Math.min(stageRect.width / naturalW, stageRect.height / naturalH);
  currentStageScale = scale;
  const offsetX = (stageRect.width - naturalW*scale) / 2;
  const offsetY = (stageRect.height - naturalH*scale) / 2;
  wrap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
fitStage();
setTimeout(fitStage, 0);
</script>
